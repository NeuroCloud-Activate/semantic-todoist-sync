name: Artifact Attestation

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-plugin-assets:
    name: Attest Obsidian plugin assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release asset inputs
        shell: bash
        run: |
          set -euo pipefail

          test -f main.js
          test -f manifest.json
          test -f styles.css
          test -f versions.json

          VERSION="$(jq -r '.version' manifest.json)"
          if [[ -z "${VERSION}" || "${VERSION}" == "null" ]]; then
            echo "manifest.json does not contain a version." >&2
            exit 1
          fi

          if [[ "${VERSION}" == v* || "${VERSION}" == V* ]]; then
            echo "Manifest version must not start with v or V: ${VERSION}" >&2
            exit 1
          fi

          jq -e --arg version "${VERSION}" 'has($version)' versions.json >/dev/null
          node --check main.js

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
