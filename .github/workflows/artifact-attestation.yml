name: Artifact Attestation

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-plugin-assets:
    name: Attest Obsidian plugin assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          path: source

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern main.js \
            --pattern manifest.json \
            --pattern styles.css

      - name: Validate release asset inputs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          test -f main.js
          test -f manifest.json
          test -f styles.css
          test -f source/versions.json

          VERSION="$(jq -r '.version' source/manifest.json)"
          if [[ -z "${VERSION}" || "${VERSION}" == "null" ]]; then
            echo "manifest.json does not contain a version." >&2
            exit 1
          fi

          if [[ "${VERSION}" == v* || "${VERSION}" == V* ]]; then
            echo "Manifest version must not start with v or V: ${VERSION}" >&2
            exit 1
          fi

          test "${RELEASE_TAG}" = "${VERSION}"
          jq -e --arg version "${VERSION}" 'has($version)' source/versions.json >/dev/null
          cmp main.js source/main.js
          cmp manifest.json source/manifest.json
          cmp styles.css source/styles.css
          node --check source/main.js

      - name: Attest main.js
        uses: actions/attest@v4
        with:
          subject-path: main.js

      - name: Attest manifest.json
        uses: actions/attest@v4
        with:
          subject-path: manifest.json

      - name: Attest styles.css
        uses: actions/attest@v4
        with:
          subject-path: styles.css
